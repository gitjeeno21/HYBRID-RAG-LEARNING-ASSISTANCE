# Every push and pull request: the full offline test suite, then a retrieval
# regression gate. Neither job needs an API key or makes an LLM call.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_DOTENV_DISABLED: "1"
  GROQ_API_KEY: ci-placeholder-no-llm-calls   # tests mock every LLM call
  HF_HUB_OFFLINE: "0"                          # CI downloads the models once per run
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only PyTorch first; the default wheel bundles CUDA)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit, integration and isolation tests
        run: python -m unittest discover -p "test_*.py" -v

  retrieval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Question files are consistent with the PDFs
        run: python eval/validate_questions.py
        continue-on-error: true   # two held-out PDFs are not in the repository
      # Hit@5 of the live configuration on the 29 held-out questions whose PDFs
      # are committed. Measured 28/29 (96.5%) when this gate was added; 0.89
      # tolerates one question of cross-platform numeric drift, and fails on
      # three or more misses.
      - name: Retrieval regression gate (zero LLM calls)
        run: >
          python eval/run_eval.py
          --only-files source_doc.pdf gpt4_technical_report.pdf "90-Day ML Engineer Roadmap.pdf"
          --top-k 5 --configs hybrid_rrf60 --no-latency
          --out ci_retrieval.json --min-hit-rate 0.89
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-report
          path: ci_retrieval.json
